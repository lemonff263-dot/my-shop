<style>
:root{--bg:#f1f5f3;--card:#fff;--ink:#0c2a21;--mut:#5b6f66;--ac:#0e6b52;--ac2:#14946f;--gold:#b8893b;--line:#d9e3de;--on:#fff}
[data-th=dark]{--bg:#08120e;--card:#0f1f18;--ink:#eaf1ed;--mut:#8ea69b;--ac:#2fbf8f;--ac2:#1d8f6a;--gold:#dcb461;--line:#1b3126;--on:#06130d}
*{box-sizing:border-box;margin:0}
body{font-family:'Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;transition:background .3s}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--card);border-bottom:2px solid var(--gold)}
.lg{display:flex;align-items:center}.lgi{height:46px;width:auto;display:block}
nav{display:flex;gap:6px;align-items:center}
nav a,nav button{position:relative;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:10px;min-width:38px;height:38px;display:grid;place-items:center;font:600 14px inherit;cursor:pointer}
nav i{position:absolute;top:-6px;right:-6px;background:var(--gold);color:#000;border-radius:9px;font:700 11px/16px inherit;min-width:16px;text-align:center}
main{max-width:1100px;margin:auto;padding:14px 12px 40px}
.bn{overflow:hidden;border-radius:18px;aspect-ratio:16/6;background:linear-gradient(120deg,var(--ac),#07271e);display:grid;place-items:center;color:#fff;font-size:26px;font-weight:700}
.bs{display:flex;width:100%;height:100%;transition:transform .7s cubic-bezier(.7,0,.2,1)}
.bs img{flex:0 0 100%;width:100%;height:100%;object-fit:cover}
.mq{overflow:hidden;margin-top:12px}
.mt{display:flex;gap:12px;width:max-content;animation:mv 40s linear infinite}
.mt.rv{animation-direction:reverse}
.mq:hover .mt{animation-play-state:paused}
@keyframes mv{to{transform:translateX(-50%)}}
.pc{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .2s,border-color .2s}
.pc:hover{transform:translateY(-3px);border-color:var(--gold)}
.pc img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--line)}
.pc.sm{width:140px;flex:none}
.pi{padding:8px 10px}.pi b{display:block;font-size:14px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pi span{color:var(--ac);font-weight:700}.pi s{color:var(--mut);font-weight:400;font-size:12px}
h2.t{margin:22px 4px 10px;font-size:20px}
.gr{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:800px){.gr{grid-template-columns:repeat(4,1fr)}.pp{grid-template-columns:1fr 1fr!important}}
.pp{display:grid;gap:18px;grid-template-columns:1fr}
.gal>img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;background:var(--line)}
.th{display:flex;gap:8px;margin-top:8px;overflow:auto}.th img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:2px solid var(--line);cursor:pointer}
.info h1{font-size:24px}.pr{font-size:26px;font-weight:700;color:var(--ac);margin:6px 0}.pr s{font-size:15px;color:var(--mut);font-weight:400}
.mut{color:var(--mut)}
.qt{display:flex;align-items:center;gap:14px;margin:12px 0}.qt button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px}
.bt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.b{border:0;border-radius:12px;padding:13px 16px;font:700 16px inherit;cursor:pointer;color:var(--on);background:linear-gradient(135deg,var(--ac2),var(--ac));width:100%}

function chips(){const cs=[...new Set(S.products.filter(p=>p.active!==false&&p.cat).map(p=>p.cat))];return cs.length?`<div class="chips"><button class="${S.cat?'':'on'}" onclick="A.cat('')">${S.lang=='bn'?'সব':'All'}</button>${cs.map(c=>`<button class="${S.cat==c?'on':''}" data-c="${esc(c)}" onclick="A.cat(this.dataset.c)">${esc(c)}</button>`).join('')}</div>`:''}
const rel=p=>{const r=act().filter(x=>x.id!=p.id).sort((a,b)=>(b.cat==p.cat&&!!p.cat)-(a.cat==p.cat&&!!p.cat)).slice(0,4);return r.length?`<h2 class="t">${S.lang=='bn'?'আরও দেখুন':'You may also like'}</h2><div class="gr">${r.map(x=>card(x)).join('')}</div>`:''};

const pcur=()=>S.products.find(x=>x.id==cur().replace(/^\//,'').split('/')[1]);
function swp(){const m=$('#mi'),pp=pcur();if(!m||!pp)return;let x0=0;m.ontouchstart=e=>x0=e.touches[0].clientX;m.ontouchend=e=>{const d=e.changedTouches[0].clientX-x0,n=(pp.images||[]).length;if(Math.abs(d)>40&&n>1){S.gi=((S.gi||0)+(d<0?1:-1)+n)%n;m.src=pp.images[S.gi]}}}

 for(let r=0;r<3;r++){let it=a.filter((_,i)=>i%3==r);if(!it.length)continue;while(it.length<8)it=it.concat(it);rows+=`<div class="mq"><div class="mt ${r==1?'rv':''}">${it.concat(it).map(p=>card(p,'sm')).join('')}</div></div>`}
 return `<div class="bn"><div class="bs" id="bs">${bn.length?bn.map((u,i)=>`<img src="${u}" alt="${esc(S.set.name||'')}"${(S.set.bl||[])[i]?` style="cursor:pointer" onclick="location.hash='/p/${S.set.bl[i]}'"`:''}>`).join(''):esc(S.set.name||'মোড়ের দোকান')}</div>${bn.length>1?`<div class="dots" id="dts">${bn.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>`:''}</div>${rows}<div class="sr"><input id="sq" type="search" value="${esc(S.sq)}" placeholder="${t('search')}" aria-label="${t('search')}" oninput="A.sq(this.value)"></div>${chips()}<h2 class="t">${S.lang=='bn'?'সব পণ্য':'All products'}</h2><div id="pg">${grid()}</div>`}

 const r=a2=>a2.map(x=>`<div class="rvi"><b>${esc(x.name)}</b> <span class="st">${'★'.repeat(x.star)}</span>${S.user?` <button aria-label="Delete" onclick="A.rdel('${x.id}','${id}')">✕</button>`:''}<br>${esc(x.text)}</div>`).join('');
 e.innerHTML=a.length?r(a.slice(0,3))+(a.length>3?`<button class="b o sm2" id="mr">${t('more')}</button>`:''):`<p class="mut">${t('norv')}</p>`;

const gf=async x=>{try{const c=L['geo_'+x];if(c)return JSON.parse(c)}catch(e){}for(const u of [`geo/${x}.json`,`https://cdn.jsdelivr.net/gh/nuhil/bangladesh-geocode@master/${x}/${x}.json`,`https://raw.githubusercontent.com/nuhil/bangladesh-geocode/master/${x}/${x}.json`]){try{const r=await fetch(u);if(!r.ok)continue;const j=await r.json();try{L['geo_'+x]=JSON.stringify(j)}catch(e){}return j}catch(e){}}throw 0};
async function geo(){if(S.geo)return;try{const g=x=>gf(x).then(j=>Array.isArray(j)&&j.find(x=>x.data)?j.find(x=>x.data).data:j);const [d,u]=await Promise.all([g('districts'),g('upazilas')]);if(!d.length||!u.length)throw 0;S.geo={d,u}}catch(e){S.geo={d:[],u:[]};S.geoFail=1}}
function combo(id,key,items){const w=$('#'+id),i=w.querySelector('input'),l=w.querySelector('.cl'),nm=x=>S.lang=='bn'?x.bn_name:x.name;
 const show=()=>{if(S.geoFail){S.f[key]={id:'x',name:i.value,bn_name:i.value};A.pm();return}const q=i.value.trim().toLowerCase(),r=items().filter(x=>(x.name+x.bn_name).toLowerCase().includes(q));l.innerHTML=r.map(x=>`<div data-i="${x.id}">${nm(x)}</div>`).join('')||`<div class="mut">—</div>`;l.hidden=false};
 i.onfocus=show;i.oninput=()=>{S.f[key]=null;show()};
 l.onclick=e=>{const d=e.target.closest('[data-i]');if(!d)return;const x=items().find(y=>y.id==d.dataset.i);S.f[key]=x;i.value=nm(x);l.hidden=true;if(key=='d'){S.f.u=null;$('#cu input').value=''}A.pm()};

 sm(){const dl=delv(),sb=csub(),tot=sb+dl,ad=+g('fv')||0;$('#sm').innerHTML=`<div><span>${t('sub')}</span><span>${fmt(sb)}</span></div><div><span>${t('delv')}</span><span>${fmt(dl)}</span></div><div class="tt"><span>${t('total')}</span><span>${fmt(tot)}</span></div><div><span>${t('adv')}</span><span>${fmt(ad)}</span></div><div><span>${t('due')}</span><b>${fmt(Math.max(0,tot-ad))}</b></div>`},
 async order(){if(closed())return cmsg();const m=document.querySelector('[name=pm]:checked').value,w=m=='cod'?g('pv'):m,dl=delv(),sb=csub(),tot=sb+dl,ad=+g('fv'),ph=g('fp');
  if(!g('fn')||!/^01\d{9}$/.test(ph)||!S.f.d||!S.f.u||!g('fa')||!g('fs')||!g('ft')||ad<minAdv(m)||ad>tot)return tt(t('bad'));if(A.busy)return;if(S.co.some(c=>{const p=S.products.find(p=>p.id==c.id);return !p||p.stock<c.qty}))return tt(S.lang=='bn'?'পর্যাপ্ত স্টক নেই':'Not enough stock');A.busy=1;

   L.mo=JSON.stringify([id,...JSON.parse(L.mo||'[]')]);if(S.fromCart){S.cart=[];L.cart='[]'}A.busy=0;if(!DEMO)fetch('/api/notify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id}),keepalive:true}).catch(()=>{});px('Purchase',{value:tot,currency:'BDT'});window.gtag&&gtag('event','purchase',{transaction_id:id,value:tot,currency:'BDT'});go('/done/'+id)}catch(e){A.busy=0;tt(e.message)}},
 ts(){const v=g('ts').toUpperCase();if(!v)return;if(/^01\d{9}$/.test(v)){Promise.all(JSON.parse(L.mo||'[]').map(i=>getDoc(doc(db,'orders',i)))).then(a=>{const r=a.filter(s=>s.exists()&&s.data().phone==v).map(s=>({id:s.id,...s.data()}));$('#tr').innerHTML=r.length?r.map(ordRow).join(''):`<p class="c">${t('nf')}</p>`})}else go('/track/'+v)},
